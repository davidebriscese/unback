version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /backend
      - /backend.Tests
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Pinned to 3.1.x on purpose: 3.2 moved to a licence this project cannot ship under.
      - dependency-name: SixLabors.ImageSharp
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # eslint-config-next still bundles an eslint-plugin-react built against the ESLint 9 rule
      # API, so ESLint 10 crashes on every file. Drop this once Next ships a compatible config.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # typescript-eslint refuses to load under TS 7. Drop this once it supports TS >= 7.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
